<!DOCTYPE html>
<html lang="en">

<head>
  <title>T20-constants</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- stylesheets *******************************************-->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/dtec_favicon.png">
</head>

<!--*************************************************************
  BODY
**************************************************************-->

<body>
  <h1>T20-constants</h1>

 
  <form onsubmit="runProgram(); return false;">
    <label for="formName">Name:</label>
    <input type="text" id="nameField" name="formName" placeholder="Name" required autofocus>
    <p style="color:red;">No numbers on NAME, Please.</p>
    <label for="formAge">Age:</label>
    <input type="number" id="ageField" name="formAge" placeholder="Age" min="1" max="99" required > <br><br>
    <label for="formMoney">Money:</label>
    <input type="number" id="moneyField" name="formMoney" placeholder="Money" required> <br><br>
    <label for="formChocolate">How much you like chocolate out of 0-3</label>
    <input type="number" id="chocolateField" name="formChocolate" placeholder="0-3" min="0" max="3" required> <br><br>
    <label for="formShopping">Shopping List</label>
    <input type="text" id="shoppingField" name="formShopping" placeholder="List" required><br><br>
    <input type="submit"> 
  </form >

  
  <div id="spaceForJavaScriptOutput"> 
  
  </div>


  <div id="output"></div>

  <div id="chocolate"></div>

  <div id="shopping"></div>


  <script src="../t20_constants.js"></script>

</body>

</html>

  END OF T20_CONSTANTS.HTML
**************************************************************-->
