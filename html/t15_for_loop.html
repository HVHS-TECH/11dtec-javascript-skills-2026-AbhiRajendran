<!DOCTYPE html>
<html lang="en">

<head>
  <title>T15-for loop</title>
  <meta charset="UTF-8">

<body>
  <h1>T15-for loop</h1>


  <form onsubmit="return false;">
    <label for="formName">Name:</label>
    <input type="text" id="nameField" name="formName" placeholder="Name">
    <label for="formAge">Age:</label>
    <input type="number" id="ageField" name="formAge" placeholder="Age"> 
    <label for="formMoney">Money:</label>
    <input type="number" id="moneyField" name="formMoney" placeholder="Money"> 
    <label for="formChocolate">How much you like chocolate out of 0-3</label>
    <input type="number" id="chocolateField" name="formChocolate" placeholder="0-3">
    <input type="submit" onclick="getFormInput(); calculatePay(); chooseOpinion();"> 
  </form >

  <div id="spaceForJavaScriptOutput">

    The output of your script will go here.

  </div>

  <form onsubmit="return false;">
    <label for="formMilk">How much milk:</label>
    <input type="number" id="milkField" name="formMilk" placeholder="Milk">
    <input type="submit" onclick="milk();"> 
  </form>
  

  <div id="output"></div>
 
  <div id="chocolate"></div>

  <div id="milk"></div>


  <script src="../t15_for_loop.js"></script>

</body>

</html>
